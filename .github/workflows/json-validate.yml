name: JSON Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Check JSON syntax for Agent Configuration
        run: |
          echo "Validating PRODUCT_COMPARATOR_V13.json..."
          jq empty PRODUCT_COMPARATOR_V13.json
          echo "Validation successful!"
