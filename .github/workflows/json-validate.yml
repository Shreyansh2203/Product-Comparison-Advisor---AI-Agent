name: JSON Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full 40-character commit SHA with the release tag in
# a trailing comment. The SHAs below were resolved from the upstream repositories
# and confirmed to be commit objects through the GitHub API, not copied from a
# tag page by hand. Bump them with:
#   git ls-remote --tags https://github.com/actions/checkout.git
#   git ls-remote --tags https://github.com/actions/setup-python.git
# and copy the SHA for the exact patch tag you want, peeled if it is annotated.
# `git ls-remote --tags` prints both `refs/tags/vX.Y.Z` and `refs/tags/vX.Y.Z^{}`
# for an annotated tag; the `^{}` line is the commit, so use that one. Dependabot
# keeps the SHA and its trailing `# vX.Y.Z` comment in step with upstream.
# The CodeQL workflow follows the same policy for github/codeql-action.
#
# Python is pinned to a supported interpreter line. 3.13 is a current bugfix
# line as of 2026-09; 3.12 and 3.11 are security-only and 3.9 is end-of-life.
# The harness is stdlib-only, so the suite is expected to be green here; the
# job-level timeout below bounds a hang rather than a slow run.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Report tool versions
        run: python --version

      - name: Confirm the agent configuration still parses
        run: |
          echo "Validating PRODUCT_COMPARATOR_V13.json..."
          python -m json.tool PRODUCT_COMPARATOR_V13.json > /dev/null
          echo "JSON syntax OK."

      # --strict fails on any finding that is not already signed off in
      # ACCEPTED_FINDINGS, so a genuine regression breaks the build instead of
      # hiding behind the acknowledged model-code / partner-metadata / empty
      # error-handler / empty-trigger / MaximumInteractions / unbound-parameter
      # facts.
      - name: Validate agent configuration contract
        run: python scripts/validate_agent.py --strict

      - name: Run structural and prompt-contract tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.log
          # A discovery mistake can make the suite exit 0 without running anything.
          # Require an explicit non-zero test count so a silent no-test-run cannot
          # pass as green.
          grep -Eq '^Ran [1-9][0-9]* tests? in ' test-output.log
          echo "Test count check passed."

      # A gate that cannot fail is not a gate. Re-introduce a regression the
      # validator is supposed to catch -- here a changed highlight colour in the
      # summarization prompt -- on a throwaway copy, and require the validator to
      # reject it. If this step starts failing with "the gate passed a regression",
      # the real checks above have been weakened.
      - name: Confirm the gate rejects a real regression
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp PRODUCT_COMPARATOR_V13.json README.md "$work/"
          cp -r scripts "$work/scripts"
          python - "$work" <<'PY'
          import json
          import os
          import sys

          path = os.path.join(sys.argv[1], "PRODUCT_COMPARATOR_V13.json")
          with open(path, encoding="utf-8") as handle:
              doc = json.load(handle)
          spec = doc["agents"][0]["Specification"]
          spec["summarizationPrompt"] = spec["summarizationPrompt"].replace(
              "#ffe6e6", "#ffcccc"
          )
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(doc, handle, indent=2)
          PY
          if output="$(python "$work/scripts/validate_agent.py" --strict 2>&1)"; then
            echo "::error::the validator accepted a prompt with a changed highlight colour"
            exit 1
          fi
          echo "$output" | grep -q 'highlight' || {
            echo "::error::the validator failed, but not for the regression that was injected"
            echo "$output"
            exit 1
          }
          echo "The gate correctly rejected the injected regression."
